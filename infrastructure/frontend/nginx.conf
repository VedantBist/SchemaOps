server {
    listen 80;
    root /usr/share/nginx/html;

    # Live event stream: no buffering, long-lived connection.
    location /api/events/stream {
        proxy_pass http://causalops-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://causalops-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    # Hashed bundles never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself must always be revalidated, so an upgraded console is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
