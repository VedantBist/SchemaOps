auth_enabled: false
server:
  http_listen_port: 3100
common:
  # Single binary with no peers: pin the ring address so the ingester becomes ready
  # instead of flapping while it tries to pick a network interface.
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  # Required for native OTLP log ingestion from the collector.
  allow_structured_metadata: true
  retention_period: 168h
ingester:
  lifecycler:
    min_ready_duration: 0s
