# ==============================================================================
# CausalOps — Production Docker Compose
# Phase 7: Production-Grade Deployment
#
# Start:   docker compose -f docker-compose.prod.yml up -d
# Shutdown: docker compose -f docker-compose.prod.yml down
# Logs:    docker compose -f docker-compose.prod.yml logs -f <service>
# ==============================================================================

networks:
  causalops-internal:
    driver: bridge
  causalops-observability:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  ml-models:
    driver: local

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       "${POSTGRES_DB:-causalops}"
      POSTGRES_USER:     "${POSTGRES_USER:-causalops}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - causalops-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    # No external port exposure in production; access via causalops-api only
    expose:
      - "5432"

  # ── AI Engine (FastAPI / Python) ─────────────────────────────────────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL:                          "${LOG_LEVEL:-INFO}"
      AI_ENGINE_SIMULATION_RATE_LIMIT:   "${AI_ENGINE_SIMULATION_RATE_LIMIT:-10}"
      AI_ENGINE_PREDICTION_RATE_LIMIT:   "${AI_ENGINE_PREDICTION_RATE_LIMIT:-30}"
      AI_ENGINE_SIMULATION_TIMEOUT:      "${AI_ENGINE_SIMULATION_TIMEOUT_SECONDS:-60}"
      CAUSALOPS_CORS_ORIGINS:            "${CAUSALOPS_CORS_ORIGINS:-http://localhost:3000}"
    volumes:
      - ./ml:/app/ml:ro
      - ./dataset:/app/dataset:ro
    networks:
      - causalops-internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # ── CausalOps API (Spring Boot) ──────────────────────────────────────────────
  causalops-api:
    build:
      context: ./backend/causalops-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST:                    "postgres"
      POSTGRES_PORT:                    "${POSTGRES_PORT:-5432}"
      POSTGRES_DB:                      "${POSTGRES_DB:-causalops}"
      POSTGRES_USER:                    "${POSTGRES_USER:-causalops}"
      POSTGRES_PASSWORD:                "${POSTGRES_PASSWORD}"
      AI_ENGINE_URL:                    "http://ai-engine:8000"
      API_GATEWAY_URL:                  "http://api-gateway:8080"
      ORDER_SERVICE_URL:                "http://order-service:8080"
      INVENTORY_SERVICE_URL:            "http://inventory-service:8080"
      PAYMENT_SERVICE_URL:              "http://payment-service:8080"
      DEMO_MODE:                        "${DEMO_MODE:-true}"
      TELEMETRY_COLLECTION_INTERVAL_MS: "${TELEMETRY_COLLECTION_INTERVAL_MS:-1000}"
      CAUSALOPS_CORS_ORIGINS:           "${CAUSALOPS_CORS_ORIGINS:-http://localhost:3000}"
      LOG_LEVEL:                        "${LOG_LEVEL:-INFO}"
    ports:
      - "${CAUSALOPS_API_PORT:-8080}:8080"
    networks:
      - causalops-internal
    healthcheck:
      test: ["CMD-SHELL",
             "curl -sf http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

  # ── Monitored microservices ───────────────────────────────────────────────────
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL:      "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-causalops}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-causalops}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
    networks:
      - causalops-internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - causalops-internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      INVENTORY_URL: "http://inventory-service:8080"
      PAYMENT_URL:   "http://payment-service:8080"
    networks:
      - causalops-internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      - inventory-service
      - payment-service

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ORDER_URL: "http://order-service:8080"
    ports:
      - "8081:8080"
    networks:
      - causalops-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      - order-service

  # ── Observability: OTel Collector ─────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - causalops-internal
      - causalops-observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Observability: Prometheus ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - causalops-observability
      - causalops-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Observability: Loki ───────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - causalops-observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Observability: Tempo ──────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    networks:
      - causalops-observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
