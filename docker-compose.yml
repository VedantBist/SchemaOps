# CausalOps development stack: the platform, its observability pipeline, and an
# instrumented reference system that produces real telemetry.
#
#   Reference system:  loadgen -> toxiproxy -> api-gateway -> order-service -> inventory-service -> inventory-db
#                                                              order-service -> payment-service
#   Telemetry:         services (OTel Java agent) -> otel-collector -> Prometheus / Tempo / Loki -> Grafana
#
# Toxiproxy sits on every real network path so DB and network latency faults are genuine delays.

# Fixed project name: container labels must match the Docker executor's scope
# (CAUSALOPS_DOCKER_PROJECT) whatever folder the repository is cloned into.
name: causalops

x-otel-agent: &otel-agent
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  # Export spans every second so span-derived counters advance smoothly between scrapes.
  OTEL_BSP_SCHEDULE_DELAY: "1000"
  OTEL_LOGS_EXPORTER: otlp
  # Internal timers (chaos expiry) are not business work; keep them out of traces.
  OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=reference,service.namespace=causalops-reference"
  CHAOS_TOKEN: "${CHAOS_TOKEN:-dev-chaos-token}"
  # The image sets the agent; the heap is sized from the container limit below.
  JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=60"

# A real memory limit, as a production deployment would have; remediation can raise it (docker update)
# and restores it on rollback. No CPU quota: CFS throttling of JVM bursts (GC/JIT threads) inflates p99
# even at ~2% average CPU, which the anomaly gate would learn and flag as noise.
x-service-limits: &service-limits
  resources:
    limits: { memory: 1536m }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      CAUSALOPS_RESTORE_SNAPSHOT: "${CAUSALOPS_RESTORE_SNAPSHOT:-true}"
      POSTGRES_DB: "${POSTGRES_DB:-causalops}"
      POSTGRES_USER: "${POSTGRES_USER:-causalops}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-causalops}"
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-reference-system.sql:ro
      # First start only: restores the calibrated demo environment (see demo/README.md).
      - ./infrastructure/postgres/02-restore-snapshot.sh:/docker-entrypoint-initdb.d/02-restore-snapshot.sh:ro
      - ./demo/snapshot:/snapshot:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 3s, retries: 20 }

  # ── Reference system network paths (fault injection points) ──────────────────
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./infrastructure/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro"]
    networks:
      default:
        # inventory-service connects to "inventory-db", which is this proxy in front of PostgreSQL.
        aliases: [inventory-db]
    depends_on: { postgres: { condition: service_healthy } }

  # ── Reference system (instrumented with the OpenTelemetry Java agent) ────────
  inventory-service:
    build: ./services/inventory-service
    deploy: *service-limits
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: inventory-service
      SPRING_DATASOURCE_URL: "jdbc:postgresql://inventory-db:5432/inventory-db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-causalops}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-causalops}"
    depends_on: [toxiproxy, otel-collector]
  payment-service:
    build: ./services/payment-service
    deploy: *service-limits
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: payment-service
    depends_on: [otel-collector]
  order-service:
    build: ./services/order-service
    deploy: *service-limits
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: order-service
      INVENTORY_URL: http://toxiproxy:18083
      PAYMENT_URL: http://toxiproxy:18084
    depends_on: [inventory-service, payment-service, toxiproxy]
  api-gateway:
    build: ./services/api-gateway
    deploy: *service-limits
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: api-gateway
      ORDER_URL: http://toxiproxy:18082
    # Not published on the host: business traffic comes from loadgen inside the network,
    # and the token-protected /internal/chaos endpoint stays unreachable from outside.
    depends_on: [order-service, toxiproxy]
  loadgen:
    image: python:3.12-slim
    command: ["python", "-u", "/loadgen/loadgen.py"]
    environment:
      LOADGEN_TARGET: http://toxiproxy:18081
      LOADGEN_RPS: "${LOADGEN_RPS:-5}"
      LOADGEN_VARIATION: "${LOADGEN_VARIATION:-0.3}"
      LOADGEN_PERIOD_S: "${LOADGEN_PERIOD_S:-600}"
    volumes: ["./infrastructure/loadgen:/loadgen:ro"]
    depends_on: [api-gateway]

  # ── Observability pipeline ────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./infrastructure/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro"]
    # 4317/4318: OTLP ingest from external systems; 13133: collector health endpoint.
    ports: ["4317:4317", "4318:4318", "13133:13133"]
    depends_on: [tempo, loki]
  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d", "--web.enable-lifecycle"]
    volumes: ["./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["9090:9090"]
  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro", "loki-data:/loki"]
    ports: ["3100:3100"]
  tempo:
    image: grafana/tempo:2.6.1
    # Runs as root in dev so it can write to the named volume created by Docker.
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infrastructure/tempo/tempo.yml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
    ports: ["3200:3200"]
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus, tempo, loki]

  # ── CausalOps platform ────────────────────────────────────────────────────────
  # Seeds the model store with the snapshot's champion model when the volume is empty.
  model-seed:
    image: alpine:3.20
    command: ["sh", "-c", "if [ -z \"$$(ls -A /models)\" ] && [ -f /snapshot/models.tar.gz ]; then tar xzf /snapshot/models.tar.gz -C /models && echo 'model store seeded from demo snapshot'; else echo 'model store already initialised'; fi"]
    volumes:
      - engine-models:/models
      - ./demo/snapshot:/snapshot:ro
  ai-engine:
    build: ./ai-engine
    ports: ["8000:8000"]
    environment:
      ENGINE_DB_HOST: postgres
      ENGINE_DB_NAME: "${POSTGRES_DB:-causalops}"
      ENGINE_DB_USER: "${POSTGRES_USER:-causalops}"
      ENGINE_DB_PASSWORD: "${POSTGRES_PASSWORD:-causalops}"
      ENGINE_MODEL_DIR: /var/lib/causalops/models
      # Shared with causalops-api; the executor endpoints refuse every call without it.
      ENGINE_INTERNAL_TOKEN: "${ENGINE_INTERNAL_TOKEN:-dev-engine-token-change-me}"
      CAUSALOPS_WEBHOOK_SECRET: "${CAUSALOPS_WEBHOOK_SECRET:-}"
    volumes:
      - ./ml:/app/ml:ro
      - ./dataset:/app/dataset:ro
      # Calibrated per-environment models (and legacy journals) need a writable location.
      - engine-models:/var/lib/causalops/models
      # Docker executor: restarts / resizes containers of the configured compose project only.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      model-seed: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 10 }
  causalops-api:
    build: ./backend/causalops-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: "${POSTGRES_DB:-causalops}"
      POSTGRES_USER: "${POSTGRES_USER:-causalops}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-causalops}"
      AI_ENGINE_URL: http://ai-engine:8000
      API_GATEWAY_URL: http://api-gateway:8080
      ORDER_SERVICE_URL: http://order-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      TOXIPROXY_URL: http://toxiproxy:8474
      CHAOS_TOKEN: "${CHAOS_TOKEN:-dev-chaos-token}"
      # Where the bootstrap environment reads its telemetry (any OTel/Prometheus stack works).
      PROMETHEUS_URL: http://prometheus:9090
      TEMPO_URL: http://tempo:3200
      LOKI_URL: http://loki:3100
      OTEL_COLLECTOR_HEALTH_URL: http://otel-collector:13133
      TELEMETRY_INGEST_INTERVAL_MS: "${TELEMETRY_INGEST_INTERVAL_MS:-5000}"
      CAUSALOPS_CORS_ORIGINS: "${CAUSALOPS_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      ENGINE_INTERNAL_TOKEN: "${ENGINE_INTERNAL_TOKEN:-dev-engine-token-change-me}"
      # The bootstrap environment may remediate containers of this compose project (the directory
      # name unless COMPOSE_PROJECT_NAME is set). Empty disables the Docker executor.
      CAUSALOPS_BOOTSTRAP_DOCKER_PROJECT: "${CAUSALOPS_DOCKER_PROJECT:-causalops}"
      CAUSALOPS_REMEDIATION_KILL_SWITCH: "${CAUSALOPS_REMEDIATION_KILL_SWITCH:-false}"
      ULPF_URL: http://ulpf:8090
    ports: ["${CAUSALOPS_API_PORT:-8080}:8080"]
    depends_on: { postgres: { condition: service_healthy }, ai-engine: { condition: service_healthy } }

  # ── ULPF: Universal Log Pre-processing Framework ──────────────────────────────
  # devices --syslog udp/tcp/tls, http--> ulpf (intake + API) --> redis stream --> ulpf-worker x N
  #   --> hash-chained raw vault + OCSF events (Postgres) --> console via causalops-api /api/ulpf
  redis:
    image: redis:7.4-alpine
    # Append-only file: queued events survive a Redis restart (nothing accepted is lost).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  ulpf:
    build: { context: ., dockerfile: infrastructure/ulpf/Dockerfile }
    image: "${DOCKERHUB_NAMESPACE:-causalops}/ulpf:${CAUSALOPS_VERSION:-latest}"
    environment: &ulpf-env
      ENGINE_DB_HOST: postgres
      ENGINE_DB_NAME: "${POSTGRES_DB:-causalops}"
      ENGINE_DB_USER: "${POSTGRES_USER:-causalops}"
      ENGINE_DB_PASSWORD: "${POSTGRES_PASSWORD:-causalops}"
      ULPF_REDIS_URL: redis://redis:6379/0
    ports:
      - "${ULPF_SYSLOG_UDP_PORT:-5514}:5514/udp"
      - "${ULPF_SYSLOG_TCP_PORT:-5514}:5514/tcp"
      - "${ULPF_SYSLOG_TLS_PORT:-6514}:6514/tcp"
      - "${ULPF_HTTP_PORT:-8090}:8090"
    volumes: [ulpf-vault:/var/lib/ulpf]
    depends_on: { redis: { condition: service_healthy }, postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"], interval: 10s, timeout: 3s, retries: 10 }
  ulpf-worker:
    build: { context: ., dockerfile: infrastructure/ulpf/Dockerfile }
    image: "${DOCKERHUB_NAMESPACE:-causalops}/ulpf:${CAUSALOPS_VERSION:-latest}"
    command: ["python", "-m", "ml.ulpf.worker"]
    environment: *ulpf-env
    volumes: [ulpf-vault:/var/lib/ulpf]
    deploy: { replicas: 2 }
    depends_on: { redis: { condition: service_healthy }, causalops-api: { condition: service_started } }
  # Realistic perimeter-device traffic (Palo Alto, FortiGate, Cisco ASA, Check Point, pfSense, Juniper,
  # Sophos, Suricata, F5 WAF, sshd, Windows) for demos; stop it to feed only your own devices.
  log-replayer:
    build: { context: ., dockerfile: infrastructure/ulpf/Dockerfile }
    image: "${DOCKERHUB_NAMESPACE:-causalops}/ulpf:${CAUSALOPS_VERSION:-latest}"
    command: ["python", "-m", "ml.ulpf.replay"]
    environment:
      ULPF_TARGET_HOST: ulpf
      ULPF_REPLAY_RATE: "${ULPF_REPLAY_RATE:-40}"
      ULPF_REDIS_URL: redis://redis:6379/0
    depends_on: { ulpf: { condition: service_healthy } }

  # ── Console (http://localhost:3000) ───────────────────────────────────────────
  frontend:
    build: { context: ., dockerfile: infrastructure/frontend/Dockerfile }
    ports: ["${CAUSALOPS_UI_PORT:-3000}:80"]
    depends_on: [causalops-api]

volumes:
  postgres-data: {}
  prometheus-data: {}
  loki-data: {}
  tempo-data: {}
  engine-models: {}
  redis-data: {}
  ulpf-vault: {}
