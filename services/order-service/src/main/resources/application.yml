server:
  port: 8080
spring:
  application:
    name: order-service
downstream:
  inventory-url: ${INVENTORY_URL:http://inventory-service:8080}
  payment-url: ${PAYMENT_URL:http://payment-service:8080}
chaos:
  token: ${CHAOS_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
