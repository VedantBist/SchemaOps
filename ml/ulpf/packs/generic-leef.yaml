id: generic-leef
version: 1
priority: 90
match:
  format: leef
time: devTime
strict: false
map:
  src: src_endpoint.ip
  dst: dst_endpoint.ip
  srcPort: src_endpoint.port
  dstPort: dst_endpoint.port
  proto: connection_info.protocol_name
  action: disposition
  usrName: actor.user.name
  leef.event_id: finding_info.uid
expect: [src_endpoint.ip, dst_endpoint.ip]
