title: Password spraying (many accounts from one address)
id: ulpf-002
status: stable
level: high
description: Failed logins for five or more different accounts from one source address within five minutes.
tags: [attack.credential_access, attack.t1110.003]
logsource:
  category: authentication
detection:
  selection:
    action: Denied
  condition: selection | count(user) by src_ip >= 5
timeframe: 5m
