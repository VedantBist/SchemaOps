server:
  port: ${CAUSALOPS_API_PORT:8080}
spring:
  application.name: causalops-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:causalops}
    username: ${POSTGRES_USER:causalops}
    password: ${POSTGRES_PASSWORD:causalops}
  flyway: { enabled: true, baseline-on-migrate: true, baseline-version: 0 }
  task:
    scheduling:
      pool:
        # Ingestion, topology sync and fault expiry run independently.
        size: 4
management.endpoints.web.exposure.include: health,info,prometheus

causalops:
  ai-url: ${AI_ENGINE_URL:http://ai-engine:8000}
  # Shared secret for the AI engine's executor endpoints (they change the monitored system).
  engine-token: ${ENGINE_INTERNAL_TOKEN:}
  cors:
    # Comma-separated browser origins allowed to call /api/**. Empty means no cross-origin access.
    allowed-origins: ${CAUSALOPS_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  http:
    connect-timeout-ms: ${CAUSALOPS_HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CAUSALOPS_HTTP_READ_TIMEOUT_MS:30000}
  # First environment created on a fresh install (only when the environments table is empty).
  environment:
    bootstrap:
      enabled: ${CAUSALOPS_BOOTSTRAP_ENVIRONMENT:true}
      name: ${CAUSALOPS_ENVIRONMENT_NAME:reference}
      prometheus-url: ${PROMETHEUS_URL:http://prometheus:9090}
      tempo-url: ${TEMPO_URL:http://tempo:3200}
      loki-url: ${LOKI_URL:http://loki:3100}
      collector-health-url: ${OTEL_COLLECTOR_HEALTH_URL:http://otel-collector:13133}
      # When set, the bootstrapped environment may restart/resize containers of this compose project.
      docker-project: ${CAUSALOPS_BOOTSTRAP_DOCKER_PROJECT:}
  remediation:
    # Global kill switch: no remediation executes in any environment while true.
    kill-switch: ${CAUSALOPS_REMEDIATION_KILL_SWITCH:false}
    verify-interval-ms: ${REMEDIATION_VERIFY_INTERVAL_MS:5000}
  telemetry:
    # Matches the Prometheus scrape interval; reading faster only repeats samples.
    ingest-interval-ms: ${TELEMETRY_INGEST_INTERVAL_MS:5000}
    retention-days: ${TELEMETRY_RETENTION_DAYS:14}
  topology:
    sync-interval-ms: ${TOPOLOGY_SYNC_INTERVAL_MS:15000}
  # Fault injection against the reference system (real mechanisms, see FaultInjector).
  chaos:
    token: ${CHAOS_TOKEN:}
    toxiproxy-url: ${TOXIPROXY_URL:http://toxiproxy:8474}
    # In-process faults: SERVICE_LATENCY, ERROR_RATE, SERVICE_FAILURE, CONNECTION_POOL_SATURATION.
    service-urls:
      api-gateway: ${API_GATEWAY_URL:http://api-gateway:8080}
      order-service: ${ORDER_SERVICE_URL:http://order-service:8080}
      inventory-service: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
      payment-service: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
    # DB_LATENCY: Toxiproxy link in front of each database.
    db-links:
      inventory-db: inventory-db
    # NETWORK_LATENCY: Toxiproxy link carrying traffic into each target.
    inbound-links:
      api-gateway: edge-to-api-gateway
      order-service: api-gateway-to-order-service
      inventory-service: order-service-to-inventory-service
      payment-service: order-service-to-payment-service
      inventory-db: inventory-db
